name: Priyansh-Bot CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Ensure languages folder exists
        run: |
          mkdir -p ./languages
          if [ ! -f ./languages/ar.lang ]; then
            echo '{"welcome":"مرحبًا بك في المجموعة","goodbye":"وداعًا","error":"حدث خطأ"}' > ./languages/ar.lang
          fi
          if [ ! -f ./languages/en.lang ]; then
            echo '{"welcome":"Welcome to the group","goodbye":"Goodbye","error":"An error occurred"}' > ./languages/en.lang
          fi

      - name: Ensure config.json exists
        run: |
          if [ ! -f ./config.json ]; then
            echo '{"language":"multi","BOTNAME":"Rizzu","ADMINBOT":["100000555481981"],"PREFIX":"/","version":"1.2.14"}' > ./config.json
          fi

      - name: Start bot
        run: |
          node index.js
        env:
          NODE_ENV: production
